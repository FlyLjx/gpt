services:
  postgres:
    image: postgres:16-alpine
    container_name: chatgpt2api-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatgpt2api
      POSTGRES_USER: chatgpt2api
      POSTGRES_PASSWORD: chatgpt2api
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatgpt2api -d chatgpt2api"]
      interval: 10s
      timeout: 5s
      retries: 5

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: chatgpt2api-flaresolverr-local
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: Asia/Shanghai
    shm_size: 2gb

  warp:
    build:
      context: .
      dockerfile: docker/warp/Dockerfile
      args:
        APT_MIRROR: https://mirrors.aliyun.com/debian
    image: chatgpt2api-warp-local:latest
    container_name: chatgpt2api-warp-local
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      TZ: Asia/Shanghai
      WARP_SOCKS_PORT: "40000"
      WARP_HTTP_PORT: "8118"
    volumes:
      - ./warp-state-local:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -x http://127.0.0.1:8118 https://ipinfo.io/json >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8

  app:
    image: ghcr.io/flyljx/chatgpt2api:latest
    container_name: chatgpt2api-local
    depends_on:
      postgres:
        condition: service_healthy
      flaresolverr:
        condition: service_started
      warp:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      TZ: Asia/Shanghai
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql://chatgpt2api:chatgpt2api@postgres:5432/chatgpt2api
      CHATGPT2API_FLARESOLVERR_ENABLED: "true"
      CHATGPT2API_FLARESOLVERR_URL: http://flaresolverr:8191
      CHATGPT2API_FLARESOLVERR_MAX_TIMEOUT_MS: "60000"
      CHATGPT2API_FLARESOLVERR_PRELOAD: "true"
      CHATGPT2API_IMAGE_ACCOUNT_CONCURRENCY: "8"
      CHATGPT2API_REFRESH_ACCOUNT_CONCURRENCY: "40"
    # 存储后端配置 (可选值: json, sqlite, postgres, git)
    # environment:
    #   STORAGE_BACKEND: json

    # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
    #   DATABASE_URL: postgresql://user:password@host:5432/dbname
    #   DATABASE_URL: sqlite:////app/data/accounts.db

    # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
    #   GIT_REPO_URL: https://github.com/user/repo.git
    #   GIT_TOKEN: ghp_xxxxxxxxxxxx
    #   GIT_BRANCH: main
    #   GIT_FILE_PATH: accounts.json

    # 认证密钥 (可选，覆盖 config.json)
    #   CHATGPT2API_AUTH_KEY: your_secret_key

    # 基础 URL (可选)
    #   CHATGPT2API_BASE_URL: https://your-domain.com
