services:
  reg-web:
    build:
      context: ..
      dockerfile: register_console/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: chatgpt2api-reg-web
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./reg-runtime:/app/runtime
    environment:
      TZ: Asia/Shanghai
      CHATGPT2API_REG_APP_ROOT: /app/runtime
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      all_proxy: ${ALL_PROXY:-}
      no_proxy: ${NO_PROXY:-}
